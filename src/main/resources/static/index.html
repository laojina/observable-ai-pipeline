<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recoverable Pipeline · 题D</title>
<style>body{font:16px/1.6 system-ui;background:#f5f7fb;color:#172b46;max-width:1120px;margin:32px auto;padding:0 20px}section{background:white;padding:24px;margin:20px 0;border:1px solid #dce3ee;border-radius:12px}input,button{font:inherit;padding:8px;margin:5px}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf2f8;padding:16px}label{display:inline-block}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}.muted{color:#52677e}#notice{color:#a63b1e}</style>
<h1>动画素材任务 · 可恢复管线</h1><p class="muted">题 D / 单实例 MVP · 四阶段计算均为显式 Mock；展示的是持久化、故障恢复和产物复用，不是人物替换效果。</p>
<section><h2>提交任务</h2><label>素材标识<input id="asset" value="demo-animation"></label><label>处理配置版本<input id="revision" value="v1"></label><br>
<label>每步耗时(ms)<input id="duration" type="number" value="1500"></label><label>超时(ms)<input id="timeout" type="number" value="30000"></label><label>故障步骤(0=无)<input id="failStep" type="number" min="0" max="4" value="3"></label><label>前几次失败<input id="failTimes" type="number" value="1"></label><br><button id="submit">提交异步任务</button><span id="notice" role="status"></span></section>
<section><h2>任务列表</h2><table><thead><tr><th>素材 / 配置</th><th>状态</th><th>操作</th></tr></thead><tbody id="tasks"></tbody></table></section>
<section><h2>步骤与历史</h2><p id="selection">选择一个任务查看。页面每秒刷新一次。</p><table><thead><tr><th>步骤</th><th>状态</th><th>尝试次数</th><th>最近耗时</th><th>心跳时间</th><th>错误 / 产物</th></tr></thead><tbody id="steps"></tbody></table><h3>阶段产物（Mock JSON）</h3><pre id="artifact">点击成功步骤的“查看产物”。</pre><h3>执行尝试与事件</h3><pre id="history"></pre></section>
<script>
let selected=null;
const element=id=>document.getElementById(id);
async function request(url,options){const response=await fetch(url,options);if(!response.ok)throw Error(await response.text());return response.json();}
function cell(row,value){const item=document.createElement('td');item.textContent=String(value??'');row.append(item);return item;}
async function refresh(){try{const tasks=await request('/api/tasks');element('tasks').replaceChildren();for(const task of tasks){const row=document.createElement('tr');cell(row,task.ASSET+' / '+task.REVISION);cell(row,task.STATUS);const actions=cell(row,'');const view=document.createElement('button');view.textContent='查看';view.onclick=()=>{selected=task.ID;refresh();};actions.append(view);if(['FAILED','SUCCEEDED'].includes(task.STATUS)){const retry=document.createElement('button');retry.textContent='恢复 / 检查产物';retry.onclick=async()=>{try{await request('/api/tasks/'+task.ID+'/retry',{method:'POST'});selected=task.ID;await refresh();}catch(error){element('notice').textContent=error.message;}};actions.append(retry);}element('tasks').append(row);}if(selected){const detail=await request('/api/tasks/'+selected);element('selection').textContent='任务 '+selected+' · '+detail.task.STATUS+' · 已完成 '+detail.steps.filter(step=>step.STATUS==='SUCCEEDED').length+'/4 步';element('steps').replaceChildren();for(const step of detail.steps){const row=document.createElement('tr');cell(row,step.POSITION+' '+step.NAME);cell(row,step.STATUS);cell(row,step.ATTEMPTS);const latest=detail.attempts.filter(attempt=>attempt.POSITION===step.POSITION).at(-1);cell(row,latest?((latest.ENDED_AT??Date.now())-latest.STARTED_AT)+' ms':'—');cell(row,step.HEARTBEAT?new Date(step.HEARTBEAT).toLocaleTimeString():'—');const output=cell(row,step.ERROR);if(step.STATUS==='SUCCEEDED'){const button=document.createElement('button');button.textContent='查看产物';button.onclick=async()=>{try{element('artifact').textContent=JSON.stringify(await request('/api/tasks/'+selected+'/artifacts/'+step.POSITION),null,2);}catch(error){element('artifact').textContent=error.message;}};output.append(button);}element('steps').append(row);}element('history').textContent=JSON.stringify({attempts:detail.attempts,events:detail.events},null,2);}}catch(error){element('notice').textContent='连接失败：'+error.message;}}
element('submit').onclick=async()=>{try{const result=await request('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({asset:element('asset').value,revision:element('revision').value,durationMs:Number(element('duration').value),timeoutMs:Number(element('timeout').value),failStep:Number(element('failStep').value),failTimes:Number(element('failTimes').value)})});selected=result.taskId;element('notice').textContent='已受理 '+selected;await refresh();}catch(error){element('notice').textContent=error.message;}};
setInterval(refresh,1000);refresh();
</script></html>
